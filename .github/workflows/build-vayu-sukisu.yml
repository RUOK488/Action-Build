name: Build for Poco X3 Pro (vayu) with SukiSU-Ultra (Final)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies (GCC 9)
        run: |
          sudo apt update
          sudo apt install -y device-tree-compiler lz4 bc bison flex libssl-dev libelf-dev gcc-9-aarch64-linux-gnu
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-9 100
          sudo update-alternatives --set aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-9

      - name: Clone kernel source (your fork, branch 16)
        run: |
          git clone --depth=1 https://github.com/RUOK488/android_kernel_vayu -b 16 kernel

      - name: Patch compiler_types.h (fix __has_attribute error)
        run: |
          cd kernel
          echo '#ifndef __has_attribute' > include/linux/compiler_types.h.new
          echo '#define __has_attribute(x) 0' >> include/linux/compiler_types.h.new
          echo '#endif' >> include/linux/compiler_types.h.new
          cat include/linux/compiler_types.h >> include/linux/compiler_types.h.new
          mv include/linux/compiler_types.h.new include/linux/compiler_types.h

      - name: Remove broken touchscreen driver (spi-xiaomi-tp)
        run: |
          cd kernel
          # Delete the source file that requires missing header
          rm -f drivers/input/touchscreen/spi-xiaomi-tp.c
          # Also disable the config option (safety)
          sed -i 's/^CONFIG_SPI_XIAOMI_TP=y/# CONFIG_SPI_XIAOMI_TP is not set/' arch/arm64/configs/vayu_defconfig
          echo "# CONFIG_SPI_XIAOMI_TP is not set" >> arch/arm64/configs/vayu_defconfig

      - name: Integrate SukiSU-Ultra (SUSFS branch)
        working-directory: ./kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs

      - name: Configure kernel (vayu_defconfig)
        working-directory: ./kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vayu_defconfig

      - name: Build kernel image
        working-directory: ./kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz-dtb

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra_vayu_$(date +%Y%m%d_%H%M%S).zip *

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra_vayu_Kernel
          path: SukiSU-Ultra_vayu_*.zip
