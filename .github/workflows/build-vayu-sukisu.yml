name: Build for Poco X3 Pro (vayu) with SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y device-tree-compiler lz4 bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Clone kernel source (your fork, branch 16)
        run: |
          git clone --depth=1 https://github.com/RUOK488/android_kernel_vayu -b 16 kernel

      - name: Setup Clang toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Integrate SukiSU-Ultra (SUSFS branch)
        working-directory: ./kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs

      - name: Configure kernel (vayu_defconfig) - using system tools for host
        working-directory: ./kernel
        run: |
          export PATH=/usr/bin:$PATH
          export HOSTCC=gcc
          export HOSTLD=ld
          make ARCH=arm64 vayu_defconfig

      - name: Build kernel image - using Clang for cross-compilation
        working-directory: ./kernel
        run: |
          export PATH=$CLANG_PATH:/usr/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export HOSTCC=gcc
          export HOSTLD=ld
          make ARCH=arm64 -j$(nproc) Image.gz-dtb

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra_vayu_$(date +%Y%m%d_%H%M%S).zip *

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra_vayu_Kernel
          path: SukiSU-Ultra_vayu_*.zip
